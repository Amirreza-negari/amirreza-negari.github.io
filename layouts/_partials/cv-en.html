{{- $cv := hugo.Data.cv }}

<section class="cv-document-page">
  <header class="cv-document-header">
    <h1>Curriculum vitae</h1>
    <nav class="cv-document-actions" aria-label="CV document">
      <a href="{{ $cv.download }}">Open PDF</a>
      <a href="{{ $cv.download }}" download="Amir-Reza_Negari_CV.pdf" type="application/pdf">Download</a>
    </nav>
  </header>

  <object class="cv-document-viewer" data="{{ $cv.download }}#view=FitH&amp;navpanes=0"
    type="application/pdf" title="{{ $cv.name.en }} — Curriculum vitae (PDF)" tabindex="0">
    <p class="cv-document-fallback">
      <a href="{{ $cv.download }}">Open the CV as a PDF</a> to read it in your browser.
    </p>
  </object>
</section>
